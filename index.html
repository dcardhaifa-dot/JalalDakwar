<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עו"ד ג׳לאל עמאד דקואר</title>
  <style>
    :root{
      --bg:#0f1a2b;
      --gradient:linear-gradient(180deg,#13233d 0%,#0f1a2b 100%);
      --gold:#c6a664;
      --text:#ffffff;
    }
    body{
      margin:0;
      font-family:"Heebo",sans-serif;
      background:var(--gradient);
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      padding:0 20px 40px;
    }
    /* HERO full width with U shape */
    .hero{
      position:relative;
      width:100vw;
      left:50%;
      right:50%;
      margin-left:-50vw;
      margin-right:-50vw;
      height:300px;
      background:url('building.png') center/cover no-repeat;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      border-bottom-left-radius:70% 35%;
      border-bottom-right-radius:70% 35%;
    }
    .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.35));}

    header{position:absolute;top:22px;width:100%;text-align:center;z-index:2}
    header img{height:80px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}

    .photo{width:140px;height:140px;border-radius:50%;overflow:hidden;margin:-60px auto 15px;border:4px solid var(--gold);box-shadow:0 0 15px rgba(0,0,0,.5);position:relative;z-index:2}
    .photo img{width:100%;height:100%;object-fit:cover}

    h1{margin:5px 0 0;font-size:22px;color:#fff}
    h2{margin:5px 0 22px;font-size:15px;color:var(--gold);font-weight:400}

    .buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 20px;width:100%;max-width:340px;margin:0 auto 22px;justify-items:center}
    .btn{width:65px;height:65px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold);text-decoration:none;transition:.25s}
    .btn:hover{background:var(--gold);color:#0f1a2b}

    .lang-switch{display:flex;gap:10px;margin:8px 0 34px}
    .lang-switch button{padding:8px 14px;border:1px solid var(--gold);border-radius:999px;background:transparent;color:var(--gold);font-size:14px;cursor:pointer}
    .lang-switch button.active{background:var(--gold);color:#0f1a2b}

    footer{margin-top:auto;font-size:13px;color:#ccc;text-align:center}
  </style>
</head>
<body>

  <!-- HERO: full width background, U shape, bigger logo -->
  <div class="hero">
    <header>
      <img src="logo.png" alt="לוגו המשרד">
    </header>
  </div>

  <div class="photo">
    <img src="lawyer.png" alt="תמונת עו"ד ג׳לאל דקואר">
  </div>

  <h1 id="name">עו״ד ג׳לאל עמאד דקואר</h1>
  <h2 id="tagline">מקרקעין | יזמות ובנייה | דיני חוזים</h2>

  <!-- ACTION BUTTONS (2 בכל שורה) -->
  <div class="buttons">
    <!-- Facebook -->
    <a id="btn-facebook" href="https://www.facebook.com/dakwar.law" class="btn" title="Facebook" aria-label="Facebook">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.3.2 2.3.2v2.6h-1.3c-1.3 0-1.7.8-1.7 1.6V12h2.9l-.5 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
    </a>
    <!-- WhatsApp -->
    <a id="btn-whatsapp" href="https://wa.me/972507863448" class="btn" title="WhatsApp" aria-label="WhatsApp">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 3.9A10 10 0 0 0 3.2 17.7L2 22l4.4-1.2A10 10 0 1 0 20 3.9zm-8 17a8.3 8.3 0 0 1-4.2-1.2l-.3-.2-2.5.7.7-2.4-.2-.3a8.3 8.3 0 1 1 6.5 3.4zm4.6-6.3c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.6.1c-.1.2-.7.8-.8 1-.1.1-.3.2-.6.1-1.6-.6-2.8-1.7-3.6-3.1-.2-.3 0-.4.1-.6.1-.1.2-.3.3-.4.1-.2.1-.3.2-.4.1-.1 0-.3 0-.4l-.8-2c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.4.2-.6.4-.2.3-.8.8-.8 2s.8 2.3.9 2.4c.1.2 1.6 2.5 3.9 3.5 2.3 1.1 2.4.8 2.8.7.4-.1 1.4-.6 1.6-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.1-.4-.2z"/></svg>
    </a>
    <!-- Phone -->
    <a id="btn-phone" href="tel:048621216" class="btn" title="טלפון" aria-label="טלפון">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.2-.3 1 .3 2 .5 3 .5.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2A17.6 17.6 0 0 1 3 6.2C3 5.5 3.5 5 4.2 5H7c.7 0 1.2.5 1.2 1.2 0 1 .2 2 .5 3 .1.4 0 .9-.3 1.2l-1.8 1.4z"/></svg>
    </a>
    <!-- Maps -->
    <a id="btn-nav" href="https://www.waze.com/he/live-map/directions?to=ll.32.814338%2C34.997828" class="btn" title="ניווט" aria-label="ניווט">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a9 9 0 0 0-9 9c0 6.1 8.2 11 8.6 11.2.2.1.6.1.8 0C12.8 22 21 17.1 21 11A9 9 0 0 0 12 2zm0 12.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </a>
    <!-- Email -->
    <a id="btn-mail" href="mailto:jalal@dakwar-law.com" class="btn" title="מייל" aria-label="מייל">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>
    </a>
    <!-- Add to contacts -->
    <a id="btn-vcard" href="vcard.vcf" class="btn" title="הוסף לאנשי קשר" aria-label="הוסף לאנשי קשר">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 12a5 5 0 1 0-10 0 5 5 0 0 0 10 0zm6 6v2H3v-2a6 6 0 0 1 12 0h6zm-4-8V8h-2V6h2V4h2v2h2v2h-2v2h-2z"/></svg>
    </a>
  </div>

  <!-- Language switch: Hebrew / Arabic only -->
  <nav class="lang-switch" aria-label="language switch">
    <button id="lang-he" class="active">עברית</button>
    <button id="lang-ar">العربية</button>
  </nav>

  <footer>© כל הזכויות שמורות למשרד עו״ד ג׳לאל דקואר</footer>

  <script>
    const i18n = {
      he: {
        lang:'he', dir:'rtl',
        name:'עו״ד ג׳לאל עמאד דקואר',
        tagline:'מקרקעין | יזמות ובנייה | דיני חוזים',
        phoneT:'טלפון', mailT:'מייל', navT:'ניווט',
        addT:'הוסף לאנשי קשר'
      },
      ar: {
        lang:'ar', dir:'rtl',
        name:'المحامي جلال عماد دكوار',
        tagline:'عقارات | تطوير وبناء | قانون العقود',
        phoneT:'هاتف', mailT:'بريد', navT:'ملاحة',
        addT:'أضِف إلى جهات الاتصال'
      }
    };

    const el = {
      name: document.getElementById('name'),
      tagline: document.getElementById('tagline'),
      phone: document.getElementById('btn-phone'),
      mail: document.getElementById('btn-mail'),
      nav: document.getElementById('btn-nav'),
      vcard: document.getElementById('btn-vcard'),
      he: document.getElementById('lang-he'),
      ar: document.getElementById('lang-ar')
    };

    function applyLang(key){
      const t = i18n[key];
      document.documentElement.lang = t.lang;
      document.documentElement.dir = t.dir;
      el.name.textContent = t.name;
      el.tagline.textContent = t.tagline;
      el.phone.title = el.phone.ariaLabel = t.phoneT;
      el.mail.title = el.mail.ariaLabel = t.mailT;
      el.nav.title = el.nav.ariaLabel = t.navT;
      el.vcard.title = el.vcard.ariaLabel = t.addT;
      el.he.classList.toggle('active', key==='he');
      el.ar.classList.toggle('active', key==='ar');
    }

    el.he.addEventListener('click', ()=>applyLang('he'));
    el.ar.addEventListener('click', ()=>applyLang('ar'));
  </script>
</body>
</html>
