<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עו"ד ג׳לאל עמאד דקואר</title>

  <style>
    :root{
      --bg:#0f1a2b;
      --gradient:linear-gradient(180deg,#13233d 0%,#0f1a2b 100%);
      --gold:#c6a664;
      --text:#ffffff;
      --white:#fff;
    }

    body{
      margin:0;
      font-family:"Heebo",sans-serif;
      background:var(--gradient);
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      min-height:100vh;
      padding:0 20px 40px;
    }

    .hero{
      position:relative;
      width:100%;
      height:260px;
      background:url('building.png') center/cover no-repeat;
      clip-path:ellipse(75% 60% at 50% 0%);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .hero::after{
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.45);
      backdrop-filter:blur(2px);
    }

    header{
      position:absolute;
      top:20px;
      width:100%;
      text-align:center;
      z-index:2;
    }

    header img{
      height:70px;
    }

    .photo{
      width:140px;
      height:140px;
      border-radius:50%;
      overflow:hidden;
      margin:-80px auto 15px;
      border:4px solid var(--gold);
      box-shadow:0 0 15px rgba(0,0,0,0.5);
      position:relative;
      z-index:2;
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      margin:5px 0 0;
      font-size:22px;
      color:var(--white);
    }

    h2{
      margin:5px 0 25px;
      font-size:15px;
      color:var(--gold);
      font-weight:400;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:18px 20px;
      width:100%;
      max-width:340px;
      margin:0 auto 25px;
      justify-items:center;
    }

    .btn{
      width:65px;
      height:65px;
      border-radius:50%;
      background:rgba(255,255,255,0.1);
      border:1px solid var(--gold);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      color:var(--gold);
      text-decoration:none;
      transition:0.3s;
    }

    .btn:hover{
      background:var(--gold);
      color:var(--bg);
    }

    .save-contact{
      background:var(--gold);
      color:var(--bg);
      padding:12px 24px;
      border-radius:30px;
      text-decoration:none;
      font-weight:600;
      margin-bottom:40px;
      transition:0.3s;
    }

    .save-contact:hover{
      opacity:0.85;
    }

    footer{
      margin-top:auto;
      font-size:13px;
      color:#ccc;
      text-align:center;
    }
  </style>

  <script src="https://kit.fontawesome.com/a2d9d6d4e6.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="hero">
    <header>
      <img src="logo.png" alt="לוגו המשרד">
    </header>
  </div>

  <div class="photo">
    <img src="lawyer.png" alt="תמונת עו״ד ג׳לאל דקואר">
  </div>

  <h1>עו״ד ג׳לאל עמאד דקואר</h1>
  <h2>מקרקעין | יזמות ובנייה | דיני חוזים</h2>

  <div class="buttons">
    <a href="https://www.facebook.com/dakwar.law" class="btn" title="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="https://wa.me/972507863448" class="btn" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <a href="tel:048621216" class="btn" title="טלפון"><i class="fas fa-phone"></i></a>
    <a href="https://www.waze.com/he/live-map/directions?to=ll.32.814338%2C34.997828" class="btn" title="ניווט"><i class="fas fa-map-marker-alt"></i></a>
    <a href="mailto:jalal@dakwar-law.com" class="btn" title="מייל"><i class="fas fa-envelope"></i></a>
    <a href="recommendations.html" class="btn" title="ממליצים"><i class="fas fa-star"></i></a>
  </div>

  <a href="vcard.vcf" class="save-contact">שמור אותי באנשי קשר</a>

  <footer>© כל הזכויות שמורות למשרד עו״ד ג׳לאל עמאד דקואר</footer>

</body>
</html>
