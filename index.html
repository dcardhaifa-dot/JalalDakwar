<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עו"ד ג׳לאל עמאד דקואר</title>
  <style>
    :root{
      --bg:#0f1a2b;
      --gradient:linear-gradient(180deg,#13233d 0%,#0f1a2b 100%);
      --gold:#c6a664;
      --text:#ffffff;
    }

    /* ====== פונט דוד בולד (נוסף לפי בקשתך) ====== */
    @font-face {
      font-family: 'DavidBold';
      src: url('davidbd.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* ====== מחלקה לשם בעברית בלבד ====== */
    .he-name {
      font-family: 'DavidBold';
      font-weight: 700;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Heebo",system-ui,sans-serif;
      background:var(--gradient);
      color:var(--text);
      display:flex;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:520px;
      min-height:100vh;
      padding:0 20px 28px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* כפתורי שפה */
    .lang-switch{
      margin-top:10px;
      display:flex;
      justify-content:center;
      gap:10px;
      align-items:center;
    }
    .lang-btn{
      border:1px solid var(--gold);
      background:transparent;
      color:var(--gold);
      border-radius:999px;
      padding:4px 10px;
      font-size:11px;
      cursor:pointer;
    }
    .lang-btn.active{
      background:var(--gold);
      color:var(--bg);
    }

    /* כפתור נגישות */
    .access-toggle{
      position:fixed;
      bottom:18px;
      left:18px;
      width:46px;
      height:46px;
      border-radius:50%;
      border:none;
      background:#0b88e6;
      color:#ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:100;
      box-shadow:0 2px 8px rgba(0,0,0,.3);
    }

    .access-toggle img{
      width:34px;
      height:34px;
      display:block;
    }

    /* פאנל נגישות */
    .access-panel{
      position:fixed;
      bottom:74px;
      left:18px;
      width:260px;
      max-width:80vw;
      background:#ffffff;
      color:#000;
      border-radius:10px;
      box-shadow:0 4px 12px rgba(0,0,0,.35);
      z-index:200;
      font-size:14px;
      overflow:hidden;
    }
    .access-panel[hidden]{display:none;}
    .access-panel-header{
      background:#0b88e6;
      color:#fff;
      padding:10px;
      text-align:center;
      font-weight:600;
    }
    .access-list{
      list-style:none;
      margin:0;
      padding:6px 0 8px;
    }
    .access-row{
      border-top:1px solid #eee;
    }
    .acc-btn{
      width:100%;
      padding:8px 14px;
      text-align:right;
      background:none;
      border:none;
      cursor:pointer;
      font:inherit;
      display:block;
    }
    .acc-btn:hover{
      background:#f3f6ff;
    }

    /* רקע עם כימור קטן */
    .hero{
      position:relative;
      width:100%;
      height:180px;
      background:url('building.png') center/cover no-repeat;
      overflow:hidden;
      border-bottom-left-radius:40% 15%;
      border-bottom-right-radius:40% 15%;
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15));
    }

    header{
      position:absolute;
      top:25%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:2;
    }
    header img{
      height:72px;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
    }

    /* תמונת עו"ד מעל הרקע */
    .photo{
      width:150px;
      height:150px;
      border-radius:50%;
      overflow:hidden;
      margin:-75px auto 15px;
      border:4px solid var(--gold);
      box-shadow:0 6px 18px rgba(0,0,0,.45);
      background:#1b273d;
      position:relative;
      z-index:3;
    }
    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      margin:4px 0 0;
      font-size:22px;
      text-align:center;
    }
    h2{
      margin:6px 0 12px;
      font-size:15px;
      color:var(--gold);
      font-weight:400;
      text-align:center;
    }

    /* רשת כפתורים קומפקטית */
    .actions{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px 18px;
      width:100%;
      justify-items:center;
      margin-top:4px;
    }
    .action{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:6px;
    }
    .btn{
      width:72px;
      height:72px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--gold);
      background:rgba(255,255,255,.08);
      color:var(--gold);
      text-decoration:none;
      transition:.2s;
    }
    .btn:hover{
      background:var(--gold);
      color:var(--bg);
    }
    .btn img{
      width:48px;
      height:48px;
      object-fit:contain;
      display:block;
    }
    .label{
      font-size:11px;
      color:var(--gold);
      opacity:.95;
    }

    footer{
      margin-top:18px;
      font-size:12px;
      color:#c9cdd6;
      text-align:center;
    }

    /* מצבי ניגודיות + קו תחתון */
    body.contrast-dark{
      background:#000 !important;
      color:#fff !important;
    }
    body.contrast-dark .hero::after{background:rgba(0,0,0,.7);}
    body.contrast-light{
      background:#ffffff !important;
      color:#000000 !important;
    }
    body.contrast-light .hero::after{background:rgba(255,255,255,.6);}
    body.underline-links a{
      text-decoration:underline;
    }

    /* גדלי טקסט */
    body.font-big h1{font-size:26px;}
    body.font-big h2{font-size:18px;}
    body.font-big .label,
    body.font-big footer,
    body.font-big .lang-btn,
    body.font-big .acc-btn{font-size:13px;}

    body.font-small h1{font-size:20px;}
    body.font-small h2{font-size:13px;}
    body.font-small .label,
    body.font-small footer,
    body.font-small .lang-btn,
    body.font-small .acc-btn{font-size:10px;}
  </style>
</head>
