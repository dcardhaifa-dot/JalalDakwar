<!doctype html>
<html lang="he" dir="rtl">
<head>

  <title>עו"ד ג׳לאל עמאד דקואר</title>
  <style>
    :root{
      --bg:#0f1a2b;
      --gradient:linear-gradient(180deg,#13233d 0%,#0f1a2b 100%);
      --gold:#c6a664;
      --text:#ffffff;
    }
    body{
      margin:0;
      font-family:"Heebo",sans-serif;
      background:var(--gradient);
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      padding:0 20px 40px;
    }
   .hero {
  height: 380px; /* מעט גבוה יותר */
  clip-path: ellipse(90% 50% at 50% 0%); /* הקימור עמוק יותר */
}
.photo {
  margin: -70px auto 25px; /* מושך את הפרופיל עוד טיפה למעלה, חופף לקימור */
}

    .photo img{width:100%;height:100%;object-fit:cover}

    h1{margin:5px 0 0;font-size:22px;color:#fff}
    h2{margin:5px 0 22px;font-size:15px;color:var(--gold);font-weight:400}

    .buttons{display:grid;grid-template-columns:repeat(3,80px);gap:20px 30px;justify-content:center;margin-top:10px}
    .btn{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:24px;color:var(--gold);text-decoration:none;transition:.25s}
    .btn svg{width:26px;height:26px}
    .btn span{font-size:11px;letter-spacing:.2px;color:var(--gold);opacity:.95}
    .btn:hover{background:var(--gold);color:#0f1a2b}
    .btn:hover span{color:#0f1a2b}

    footer{margin-top:auto;font-size:13px;color:#ccc;text-align:center}
  </style>
</head>
