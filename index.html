<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עו"ד ג׳לאל עמאד דקואר</title>
  <style>
    :root{
      --bg:#0f1a2b;
      --gradient:linear-gradient(180deg,#13233d 0%,#0f1a2b 100%);
      --gold:#c6a664;
      --text:#ffffff;
    }
    body{
      margin:0;
      font-family:"Heebo",system-ui,sans-serif;
      background:var(--gradient);
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      padding:0 20px 40px;
    }

    /* HERO עם V עמוק */
    .hero{
      position:relative;
      width:100%;
      height:380px;                                    /* גבוה יותר */
      background:url('building.png') center top/cover no-repeat;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      clip-path:ellipse(90% 50% at 50% 0%);            /* V עמוק */
    }
    .hero::after{
      content:"";
      position:absolute; inset:0;
      background:rgba(0,0,0,.45);
    }

    /* לוגו במרכז חצי עליון של ה-V */
    header{
      position:absolute;
      top:38%;                                         /* למעלה בתוך הקימור */
      left:50%; transform:translate(-50%,-50%);
      z-index:2; text-align:center;
    }
    header img{
      height:92px;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
    }

    /* פרופיל חותך את הקימור */
    .photo{
      width:160px; height:160px; border-radius:50%; overflow:hidden;
      margin:-85px auto 22px;                          /* עולה לתוך ה-V */
      border:4px solid var(--gold);
      box-shadow:0 0 15px rgba(0,0,0,.5);
      position:relative; z-index:3;
      background:#1b273d;
    }
    .photo img{width:100%;height:100%;object-fit:cover}

    h1{margin:6px 0 0;font-size:22px;color:#fff;text-align:center}
    h2{margin:6px 0 20px;font-size:15px;color:var(--gold);font-weight:400;text-align:center}

    /* רשת כפתורים – עיגולים + טקסט מתחת */
    .actions{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:22px 28px;
      width:100%;
      max-width:430px;
      justify-items:center;
    }
    .action{display:flex;flex-direction:column;align-items:center;gap:8px}
    .btn{
      width:78px;height:78px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      border:1px solid var(--gold);
      background:rgba(255,255,255,.08);
      color:var(--gold);
      text-decoration:none;
      transition:.25s;
    }
    .btn:hover{background:var(--gold);color:var(--bg)}
    .btn svg{width:26px;height:26px}
    .label{font-size:12px;color:var(--gold);opacity:.95}

    footer{margin-top:32px;font-size:13px;color:#ccc;text-align:center}

    @media (max-width:360px){
      .hero{height:360px}
      .photo{width:148px;height:148px;margin:-78px auto 18px}
      .btn{width:72px;height:72px}
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <header>
      <img src="logo.png" alt="לוגו המשרד">
    </header>
  </div>

  <!-- פרופיל -->
  <div class="photo">
    <img src="lawyer.png" alt="תמונת עו״ד ג׳לאל דקואר">
  </div>

  <!-- כותרות -->
  <h1>עו״ד ג׳לאל עמאד דקואר</h1>
  <h2>מקרקעין | יזמות ובנייה | דיני חוזים</h2>

  <!-- כפתורים -->
  <div class="actions">
    <div class="action">
      <a href="https://www.facebook.com/dakwar.law" class="btn" title="Facebook" aria-label="Facebook">
        <!-- Facebook SVG -->

      </a>

    <div class="action">

    <div class="action">
      <a href="https://www.waze.com/he/live-map/directions?to=ll.32.814338%2C34.997828" class="btn" title="ניווט" aria-label="ניווט">
        <!-- Pin/Map SVG -->

    </div>

    <div class="action">
      <a href="mailto:jalal@dakwar-law.com" class="btn" title="מייל" aria-label="מייל">
        <!-- Mail SVG -->
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>

    <div class="action">
      <a href="vcard.vcf" class="btn" title="הוסף לאנשי קשר" aria-label="הוסף לאנשי קשר">
        <!-- Add-user SVG -->
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 12a5 5 0 1 0-10 0 5 5 0 0 0 10 0zm6 6v2H3v-2a6 6 0 0 1 12 0h6zm-4-8V8h-2V6h2V4h2v2h2v2h-2v2h-2z"/></svg>
      </a>
      <div class="label">אנשי קשר</div>
    </div>
  </div>

  <footer>© כל הזכויות שמורות למשרד עו״ד ג׳לאל דקואר</footer>
</body>
</html>
